<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TradeSignals">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Trade Signals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root {
  --bg: #0a0e17;
  --bg2: #111827;
  --bg3: #1a2235;
  --bg4: #243049;
  --border: #2a3550;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --text3: #64748b;
  --green: #22c55e;
  --green-bg: rgba(34,197,94,0.08);
  --green-glow: rgba(34,197,94,0.25);
  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.08);
  --red-glow: rgba(239,68,68,0.25);
  --amber: #f59e0b;
  --amber-bg: rgba(245,158,11,0.08);
  --amber-glow: rgba(245,158,11,0.25);
  --blue: #3b82f6;
  --blue-bg: rgba(59,130,246,0.08);
  --font: 'Outfit', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
html{background:var(--bg);color:var(--text);font-family:var(--font);}
body{min-height:100vh;padding:20px 16px 60px;}

/* ── HEADER ── */
.header{max-width:1400px;margin:0 auto 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.logo{font-size:1.6rem;font-weight:800;letter-spacing:-0.03em;background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo span{font-weight:400;opacity:0.7;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.api-input{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:var(--mono);font-size:0.78rem;width:220px;outline:none;transition:border-color 0.2s;}
.api-input:focus{border-color:var(--blue);}
.api-input::placeholder{color:var(--text3);}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0;}
.status-dot.live{background:var(--green);box-shadow:0 0 8px var(--green-glow);}

/* ── WATCHLIST BAR ── */
.watchlist-bar{max-width:1400px;margin:0 auto 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.add-form{display:flex;gap:6px;}
.sym-input{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:var(--mono);font-size:0.85rem;width:110px;text-transform:uppercase;outline:none;}
.sym-input:focus{border-color:var(--blue);}
.btn{padding:8px 16px;border-radius:8px;border:none;font-family:var(--font);font-weight:600;font-size:0.82rem;cursor:pointer;transition:all 0.15s;}
.btn-add{background:var(--blue);color:#fff;}
.btn-add:hover{filter:brightness(1.15);}
.btn-sm{padding:4px 10px;font-size:0.75rem;background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
.btn-sm:hover{background:var(--bg4);color:var(--text);}
.btn-refresh{background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
.btn-refresh:hover{background:var(--bg4);color:var(--text);}
.presets{display:flex;gap:6px;flex-wrap:wrap;}
.preset-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:0.75rem;font-weight:500;cursor:pointer;transition:all 0.15s;}
.preset-btn:hover{background:var(--bg3);color:var(--text);}

.divider{width:1px;height:24px;background:var(--border);margin:0 4px;}

/* ── GRID ── */
.grid{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;}

/* ── CARD ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:visible;transition:border-color 0.3s,box-shadow 0.3s;position:relative;}
.card.buy{border-color:rgba(34,197,94,0.35);box-shadow:0 0 20px rgba(34,197,94,0.06);}
.card.sell{border-color:rgba(239,68,68,0.35);box-shadow:0 0 20px rgba(239,68,68,0.06);}
.card.wait{border-color:rgba(245,158,11,0.25);}
.card-head{padding:16px 18px 12px;display:flex;align-items:flex-start;justify-content:space-between;}
.card-sym{font-family:var(--mono);font-size:1.25rem;font-weight:700;letter-spacing:0.02em;}
.card-price{font-family:var(--mono);font-size:1.1rem;font-weight:500;color:var(--text2);}
.card-change{font-size:0.82rem;font-weight:600;}
.card-change.up{color:var(--green);}
.card-change.down{color:var(--red);}
.card-remove{background:none;border:none;color:var(--text3);cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:4px;}
.card-remove:hover{color:var(--red);background:var(--red-bg);}
.card-refresh{background:none;border:none;color:var(--text3);cursor:pointer;font-size:0.9rem;padding:2px 6px;border-radius:4px;transition:all 0.15s;}
.card-refresh:hover{color:var(--blue);background:var(--blue-bg);}
.card-refresh.spinning{animation:spin 0.8s linear infinite;pointer-events:none;color:var(--blue);}
.card-actions{display:flex;gap:2px;align-items:center;}
.card-move{background:none;border:none;color:var(--text3);cursor:pointer;font-size:0.75rem;padding:2px 5px;border-radius:4px;transition:all 0.15s;line-height:1;}
.card-move:hover{color:var(--text);background:var(--bg3);}
.card-move:disabled{opacity:0.2;cursor:default;pointer-events:none;}
.card-move-group{display:flex;flex-direction:column;gap:0;}

/* Drag state */
.card.dragging{opacity:0.4;transform:scale(0.97);}
.card.drag-over{border-color:var(--blue) !important;box-shadow:0 0 16px rgba(59,130,246,0.2) !important;}

/* Custom presets */
.preset-btn.custom{background:var(--bg3);border-color:rgba(59,130,246,0.3);color:var(--blue);}
.preset-btn.custom:hover{background:var(--bg4);}
.preset-delete{margin-left:4px;font-size:0.65rem;opacity:0.5;cursor:pointer;}
.preset-delete:hover{opacity:1;color:var(--red);}
.save-preset-bar{display:flex;align-items:center;gap:6px;}
.preset-name-input{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--text);font-size:0.78rem;width:130px;outline:none;font-family:var(--font);}
.preset-name-input:focus{border-color:var(--blue);}
.preset-name-input::placeholder{color:var(--text3);}

/* Signal badge */
.signal-row{padding:0 18px 14px;display:flex;align-items:center;gap:12px;}
.signal-badge{padding:6px 18px;border-radius:8px;font-weight:700;font-size:0.95rem;letter-spacing:0.05em;text-transform:uppercase;}
.signal-badge.buy{background:var(--green-bg);color:var(--green);border:1px solid rgba(34,197,94,0.25);}
.signal-badge.sell{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,0.25);}
.signal-badge.wait{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(245,158,11,0.25);}
.confidence{font-family:var(--mono);font-size:0.85rem;color:var(--text2);}
.confidence strong{color:var(--text);}

/* Reasons */
.reasons{padding:0 18px 16px;display:flex;flex-direction:column;gap:6px;}
.reason{display:flex;align-items:flex-start;gap:8px;font-size:0.82rem;color:var(--text2);line-height:1.4;}
.reason-icon{flex-shrink:0;margin-top:2px;font-size:0.7rem;}
.reason-icon.bull{color:var(--green);}
.reason-icon.bear{color:var(--red);}
.reason-icon.neutral{color:var(--amber);}

/* Metrics row */
.metrics{padding:0 18px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.metric{background:var(--bg3);border-radius:8px;padding:8px 10px;position:relative;cursor:help;}
.metric-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);margin-bottom:2px;}
.metric-val{font-family:var(--mono);font-size:0.85rem;font-weight:600;}
.metric-val.bull{color:var(--green);}
.metric-val.bear{color:var(--red);}
.metric-val.neutral{color:var(--amber);}

/* Tooltip */
.tip{position:absolute;background:#1e293b;color:var(--text);font-size:0.72rem;padding:8px 12px;border-radius:8px;white-space:normal;width:220px;line-height:1.45;pointer-events:none;opacity:0;transition:opacity 0.2s;z-index:1000;border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,0.5);font-family:var(--font);font-weight:400;}
.tip::after{content:'';position:absolute;border:6px solid transparent;}
/* Default: above */
.tip.pos-above{bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);}
.tip.pos-above::after{top:100%;left:50%;transform:translateX(-50%);border-top-color:#1e293b;}
/* Below */
.tip.pos-below{top:calc(100% + 8px);left:50%;transform:translateX(-50%);}
.tip.pos-below::after{bottom:100%;left:50%;transform:translateX(-50%);border-bottom-color:#1e293b;}
/* Left-align when near right edge */
.tip.align-left{left:0;transform:none;}
.tip.align-left::after{left:16px;transform:none;}
/* Right-align when near left edge */
.tip.align-right{left:auto;right:0;transform:none;}
.tip.align-right::after{left:auto;right:16px;transform:none;}
.metric:hover .tip{opacity:1;}

/* Sector ref */
.sector-ref{padding:0 18px 14px;font-size:0.75rem;color:var(--text3);display:flex;align-items:center;gap:6px;}
.sector-ref .dot{width:6px;height:6px;border-radius:50%;}
.sector-ref .dot.up{background:var(--green);}
.sector-ref .dot.down{background:var(--red);}

/* Blocker bar */
.blocker{margin:0 18px 14px;padding:10px 14px;background:var(--amber-bg);border:1px solid rgba(245,158,11,0.2);border-radius:8px;font-size:0.78rem;color:var(--amber);display:flex;align-items:flex-start;gap:8px;line-height:1.4;}
.blocker-icon{font-size:0.9rem;flex-shrink:0;}

/* Loading */
.card-loading{padding:30px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--text3);font-size:0.85rem;}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.card-error{padding:20px 18px;color:var(--red);font-size:0.82rem;text-align:center;}

/* Timestamp */
.timestamp{padding:0 18px 14px;font-size:0.68rem;color:var(--text3);font-family:var(--mono);}

/* ── Position Tracker ── */
.position-bar{margin:0 18px 14px;padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;}
.position-bar.in-trade{border-color:rgba(59,130,246,0.3);}
.pos-entry-form{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pos-entry-form label{font-size:0.72rem;color:var(--text3);}
.pos-input{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--text);font-family:var(--mono);font-size:0.78rem;width:80px;outline:none;}
.pos-input:focus{border-color:var(--blue);}
.pos-input::placeholder{color:var(--text3);}
.pos-ticker-input{width:65px;text-transform:uppercase;}
.pos-btn{padding:4px 12px;border-radius:6px;border:none;font-family:var(--font);font-weight:600;font-size:0.72rem;cursor:pointer;transition:all 0.15s;}
.pos-btn-enter{background:var(--blue);color:#fff;}
.pos-btn-enter:hover{filter:brightness(1.15);}
.pos-btn-exit{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,0.25);}
.pos-btn-exit:hover{background:rgba(239,68,68,0.15);}

/* Active position display */
.pos-active{display:flex;flex-direction:column;gap:8px;}
.pos-header{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pos-ticker-badge{font-family:var(--mono);font-weight:700;font-size:0.85rem;padding:3px 10px;border-radius:5px;background:var(--blue-bg);color:var(--blue);border:1px solid rgba(59,130,246,0.25);}
.pos-direction{font-size:0.7rem;font-weight:600;text-transform:uppercase;padding:2px 8px;border-radius:4px;}
.pos-direction.long{background:var(--green-bg);color:var(--green);}
.pos-direction.short{background:var(--red-bg);color:var(--red);}
.pos-pnl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.pos-entry-label{font-size:0.72rem;color:var(--text3);}
.pos-entry-price{font-family:var(--mono);font-size:0.82rem;color:var(--text2);}
.pos-pnl{font-family:var(--mono);font-size:1rem;font-weight:700;}
.pos-pnl.profit{color:var(--green);}
.pos-pnl.loss{color:var(--red);}
.pos-leverage-note{font-size:0.68rem;color:var(--text3);}
.pos-stop{font-size:0.72rem;color:var(--amber);font-family:var(--mono);margin-top:2px;}

/* Exit signal */
.exit-signal{margin:0 18px 14px;padding:10px 14px;border-radius:8px;display:flex;align-items:flex-start;gap:8px;font-size:0.8rem;line-height:1.4;}
.exit-signal.hold{background:var(--green-bg);border:1px solid rgba(34,197,94,0.2);color:var(--green);}
.exit-signal.exit{background:var(--red-bg);border:1px solid rgba(239,68,68,0.2);color:var(--red);}
.exit-signal.caution{background:var(--amber-bg);border:1px solid rgba(245,158,11,0.2);color:var(--amber);}
.exit-icon{font-size:0.9rem;flex-shrink:0;margin-top:1px;}

/* Symbol Info Bar */
.sym-info{padding:0 18px 12px;}
.sym-info-name{font-size:0.8rem;color:var(--text2);font-weight:500;margin-bottom:4px;}
.sym-info-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
.sym-tag{font-size:0.65rem;padding:2px 8px;border-radius:4px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;font-family:var(--mono);}
.sym-tag.letf{background:rgba(59,130,246,0.12);color:var(--blue);border:1px solid rgba(59,130,246,0.2);}
.sym-tag.ietf{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,0.2);}
.sym-tag.etf{background:rgba(139,92,246,0.1);color:#a78bfa;border:1px solid rgba(139,92,246,0.2);}
.sym-tag.stock{background:rgba(34,197,94,0.08);color:var(--green);border:1px solid rgba(34,197,94,0.2);}
.sym-tag.sector{background:rgba(245,158,11,0.08);color:var(--amber);border:1px solid rgba(245,158,11,0.2);}
.sym-tag.leverage{background:rgba(236,72,153,0.1);color:#f472b6;border:1px solid rgba(236,72,153,0.2);}
.sym-tag.direction-bull{background:rgba(34,197,94,0.08);color:var(--green);border:1px solid rgba(34,197,94,0.2);}
.sym-tag.direction-bear{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,0.2);}
.sym-info-desc{font-size:0.73rem;color:var(--text3);line-height:1.45;}
.sym-info-underlying{margin-top:5px;font-size:0.72rem;color:var(--text3);display:flex;align-items:center;gap:5px;}
.sym-info-underlying strong{color:var(--text2);}

/* Responsive */
@media(max-width:480px){
  .grid{grid-template-columns:1fr;}
  .header{flex-direction:column;align-items:flex-start;}
  .header-right{margin-left:0;width:100%;}
  .api-input{width:100%;}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">TradeSignals <span>/ live</span></div>
  <div class="header-right">
    <div class="status-dot" id="statusDot" title="Connection status"></div>
    <input type="password" class="api-input" id="apiKey" placeholder="Finnhub API key" autocomplete="off">
    <input type="url" class="api-input" id="proxyUrl" placeholder="Your proxy URL (Cloudflare Worker, optional)" autocomplete="off" style="margin-top:8px">
  </div>
</div>

<div class="watchlist-bar">
  <div class="add-form">
    <input type="text" class="sym-input" id="symInput" placeholder="AAPL" maxlength="10">
    <button class="btn btn-add" onclick="addSymbol()">Add</button>
    <button class="btn btn-refresh" onclick="refreshAll()">↻ Refresh All</button>
    <button class="btn btn-sm" onclick="clearAll()" style="color:var(--red);">Clear All</button>
  </div>
  <div class="divider"></div>
  <div class="presets">
    <button class="preset-btn" onclick="loadPreset('leveraged')">Leveraged ETFs</button>
    <button class="preset-btn" onclick="loadPreset('inverse')">Inverse ETFs</button>
    <button class="preset-btn" onclick="loadPreset('pairs')">Bull/Bear Pairs</button>
    <button class="preset-btn" onclick="loadPreset('tech')">Big Tech</button>
    <button class="preset-btn" onclick="loadPreset('semis')">Semiconductors</button>
    <button class="preset-btn" onclick="loadPreset('sector')">Sector ETFs</button>
    <button class="preset-btn" onclick="loadPreset('crypto')">Crypto</button>
    <button class="preset-btn" onclick="loadPreset('defense')">Defense</button>
    <button class="preset-btn" onclick="loadPreset('energy')">Energy</button>
    <button class="preset-btn" onclick="loadPreset('gold')">Gold</button>
    <span id="customPresets"></span>
  </div>
  <div class="divider"></div>
  <div class="save-preset-bar">
    <input type="text" class="preset-name-input" id="presetNameInput" placeholder="Preset name" maxlength="20">
    <button class="btn btn-sm" onclick="saveCustomPreset()">Save List</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const PRESETS = {
  leveraged: ['TQQQ','SOXL','UPRO','SPXL','TNA','LABU','FAS','NUGT'],
  tech: ['AAPL','MSFT','NVDA','GOOGL','AMZN','META','TSLA','AMD'],
  sector: ['SPY','QQQ','SOXX','XLF','XLE','XLV','GLD','TLT'],
  inverse: ['SQQQ','SOXS','SPXS','TZA','LABD','FAZ','DUST','SDOW'],
  semis: ['NVDA','AMD','AVGO','QCOM','MU','INTC','MRVL','SOXL','SOXS','SOXX'],
  crypto: ['IBIT','BITO','MSTR','COIN','MARA','RIOT','CLSK'],
  defense: ['LMT','RTX','NOC','GD','BA','KTOS','ITA'],
  energy: ['XOM','CVX','COP','XLE','ERX','ERY'],
  gold: ['GLD','GDX','NEM','GOLD','NUGT','DUST'],
  pairs: ['TQQQ','SQQQ','SOXL','SOXS','UPRO','SPXS','TNA','TZA','LABU','LABD'],
};

// Index/sector reference map — what each symbol should be benchmarked against
const SECTOR_MAP = {
  // Leveraged / Inverse → their index
  TQQQ:'QQQ', SQQQ:'QQQ', QLD:'QQQ', PSQ:'QQQ',
  SOXL:'SOXX', SOXS:'SOXX',
  UPRO:'SPY', SPXU:'SPY', SPXL:'SPY', SPXS:'SPY', SH:'SPY',
  SDOW:'DIA', UDOW:'DIA',
  TNA:'IWM', TZA:'IWM',
  LABU:'XBI', LABD:'XBI',
  FAS:'XLF', FAZ:'XLF',
  NUGT:'GLD', DUST:'GLD', JNUG:'GDX', JDST:'GDX',
  ERX:'XLE', ERY:'XLE',
  TECL:'XLK', TECS:'XLK',
  CURE:'XLV',
  // Big tech → QQQ
  AAPL:'QQQ', MSFT:'QQQ', NVDA:'QQQ', GOOGL:'QQQ', GOOG:'QQQ',
  AMZN:'QQQ', META:'QQQ', TSLA:'QQQ', AMD:'SOXX', AVGO:'SOXX',
  MU:'SOXX', INTC:'SOXX', QCOM:'SOXX', MRVL:'SOXX', LRCX:'SOXX',
  AMAT:'SOXX', KLAC:'SOXX', ON:'SOXX', MCHP:'SOXX',
  // Crypto-linked
  MSTR:'BTC-USD', COIN:'BTC-USD', MARA:'BTC-USD', RIOT:'BTC-USD', CLSK:'BTC-USD',
  BITF:'BTC-USD', HUT:'BTC-USD', IBIT:'BTC-USD', BITO:'BTC-USD',
  // Miners → gold
  NEM:'GLD', GOLD:'GLD', AEM:'GLD', KGC:'GLD', FNV:'GLD',
  // Energy
  XOM:'XLE', CVX:'XLE', COP:'XLE', SLB:'XLE', OXY:'XLE',
  // Defense
  LMT:'ITA', RTX:'ITA', NOC:'ITA', GD:'ITA', BA:'ITA', KTOS:'ITA',
  // Airlines
  DAL:'JETS', UAL:'JETS', LUV:'JETS', AAL:'JETS',
  // Default
  SPY:'SPY', QQQ:'QQQ', DIA:'DIA', IWM:'IWM'
};

const IS_INVERSE = new Set(['SQQQ','SOXS','SPXU','SPXS','SH','SDOW','TZA','LABD','FAZ','DUST','JDST','ERY','TECS','PSQ']);

// ═══════════════════════════════════════════════════════════════
// SYMBOL INFO DATABASE
// type: stock | etf | letf (leveraged ETF) | ietf (inverse ETF)
// leverage: multiplier (1 for normal, 2/3 for leveraged)
// underlying: the index/ETF it tracks
// ═══════════════════════════════════════════════════════════════
const SYMBOL_INFO = {

let customProxy = localStorage.getItem('ts_proxy') || '';
let lastProxyError = '';

// ═══════════════════════════════════════════════════════════════
// CORS PROXY CHAIN for Yahoo Finance
// Uses both query1 and query2 Yahoo domains, races multiple proxies
// ═══════════════════════════════════════════════════════════════
const CORS_PROXIES = [
  url => customProxy ? `${customProxy}/?url=${encodeURIComponent(url)}` : null,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://yacdn.org/proxy/${url}`,
  url => `https://corsproxy.org/?${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
  url => `https://api.cors.lol/?url=${encodeURIComponent(url)}`,
  url => `https://proxy.corsfix.com/?${encodeURIComponent(url)}`,
  url => `https://cors-proxy.htmldriven.com/?url=${encodeURIComponent(url)}`,
  url => `https://thingproxy.freeboard.io/fetch/${url}`,
];
let lastWorkingProxy = -1;

async function yahooFetch(url) {
  // Try both Yahoo domains
  const url2 = url.replace('query1.finance.yahoo.com', 'query2.finance.yahoo.com');
  const urls = [url, url2];

  // If we have a known working proxy, try it first on both domains (fast path)
  if (lastWorkingProxy >= 0) {
    for (const u of urls) {
      try {
        const r = await tryProxy(lastWorkingProxy, u);
        if (r) return r;
      } catch(e) {}
    }
    // Last working proxy failed, reset it
    lastWorkingProxy = -1;
  }

  // Race all proxies on both domains simultaneously
  // Build array of all attempts: [proxy0+url1, proxy0+url2, proxy1+url1, ...]
  const attempts = [];
  for (let pi = 0; pi < CORS_PROXIES.length; pi++) {
    for (const u of urls) {
      attempts.push({ pi, url: u });
    }
  }
  // Also try direct fetch (will fail from file:// or most origins, but cheap to try)
  for (const u of urls) {
    attempts.push({ pi: -1, url: u });
  }

  try {
    return await new Promise((resolve, reject) => {
      let settled = false;
      let failures = 0;
      const total = attempts.length;

      attempts.forEach(({ pi, url: u }) => {
        tryProxy(pi, u)
          .then(result => {
            if (result && !settled) {
              settled = true;
              if (pi >= 0) lastWorkingProxy = pi;
              resolve(result);
            } else {
              failures++;
              if (failures >= total && !settled) { settled = true; reject(new Error('All proxies failed')); }
            }
          })
          .catch(() => {
            failures++;
            if (failures >= total && !settled) { settled = true; reject(new Error('All proxies failed')); }
          });
      });

      // Global timeout
      setTimeout(() => {
        if (!settled) { settled = true; reject(new Error('Timeout')); }
      }, 15000);
    });
  } catch(e) {
    console.warn('yahooFetch: all attempts failed for', url, e.message);
    return null;
  }
}

async function tryProxy(pi, url) {
  const fetchUrl = pi === -1 ? url : CORS_PROXIES[pi](url);
  if (!fetchUrl) throw new Error('proxy not configured');
  const r = await fetch(fetchUrl, { signal: AbortSignal.timeout(10000) });
  if (!r.ok) { lastProxyError = `HTTP ${r.status}`; throw new Error(`HTTP ${r.status}`); }
  const text = await r.text();
  // Some proxies wrap response in JSON (allorigins /get endpoint, htmldriven, etc.)
  let data = text;
  if (!data.trim().startsWith('{')) {
    // Try to parse as wrapper JSON with .contents field
    try {
      const wrapper = JSON.parse(data);
      if (wrapper.contents) data = wrapper.contents;
      else throw new Error('not a wrapper');
    } catch(e) {
      throw new Error('Non-JSON response');
    }
  }
  const json = JSON.parse(data);
  const result = json?.chart?.result?.[0];
  if (!result || !result.timestamp) throw new Error('No chart data');
  return result;
}

// ═══════════════════════════════════════════════════════════════
// DATA CACHE — avoids redundant API calls for recently-fetched data
// ═══════════════════════════════════════════════════════════════
const dataCache = new Map(); // key → { data, ts }
const CACHE_TTL = {
  finnhub: 60 * 1000,     // 1 min  — live quotes change fast
  intraday: 2 * 60 * 1000, // 2 min  — 30m candles, moderate refresh
  daily: 10 * 60 * 1000,   // 10 min — daily bars barely change intraday
};

function cacheGet(key, ttl) {
  const entry = dataCache.get(key);
  if (!entry) return null;
  if (Date.now() - entry.ts > ttl) { dataCache.delete(key); return null; }
  return entry.data;
}

function cacheSet(key, data) {
  dataCache.set(key, { data, ts: Date.now() });
}

// Get intraday 30m candles from Yahoo (2 days)
async function getIntraday(sym) {
  const key = `intraday:${sym}`;
  const cached = cacheGet(key, CACHE_TTL.intraday);
  if (cached) return cached;
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=2d&interval=30m&includePrePost=false`;
  const data = await yahooFetch(url);
  if (data) cacheSet(key, data);
  return data;
}

// Get daily candles from Yahoo (3 months for moving averages)
async function getDaily(sym) {
  const key = `daily:${sym}`;
  const cached = cacheGet(key, CACHE_TTL.daily);
  if (cached) return cached;
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=3mo&interval=1d&includePrePost=false`;
  const data = await yahooFetch(url);
  if (data) cacheSet(key, data);
  return data;
}

// Get Finnhub quote
async function getFinnhubQuote(sym) {
  if (!finnhubKey) return null;
  const key = `fhquote:${sym}`;
  const cached = cacheGet(key, CACHE_TTL.finnhub);
  if (cached) return cached;
  try {
    const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(sym)}&token=${finnhubKey}`, { signal: AbortSignal.timeout(6000) });
    if (!r.ok) return null;
    const data = await r.json();
    if (data) cacheSet(key, data);
    return data;
  } catch(e) { return null; }
}

// ═══════════════════════════════════════════════════════════════
// TECHNICAL CALCULATIONS
// ═══════════════════════════════════════════════════════════════

function calcEMA(data, period) {
  if (data.length < period) return [];
  const k = 2 / (period + 1);
  let ema = [data.slice(0, period).reduce((a, b) => a + b, 0) / period];
  for (let i = period; i < data.length; i++) {
    ema.push(data[i] * k + ema[ema.length - 1] * (1 - k));
  }
  return ema;
}

function calcSMA(data, period) {
  const result = [];
  for (let i = period - 1; i < data.length; i++) {
    result.push(data.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0) / period);
  }
  return result;
}

function calcRSI(closes, period = 14) {
  if (closes.length < period + 1) return null;
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const diff = closes[i] - closes[i - 1];
    if (diff > 0) gains += diff; else losses -= diff;
  }
  let avgGain = gains / period;
  let avgLoss = losses / period;
  for (let i = period + 1; i < closes.length; i++) {
    const diff = closes[i] - closes[i - 1];
    avgGain = (avgGain * (period - 1) + Math.max(diff, 0)) / period;
    avgLoss = (avgLoss * (period - 1) + Math.max(-diff, 0)) / period;
  }
  if (avgLoss === 0) return 100;
  const rs = avgGain / avgLoss;
  return 100 - (100 / (1 + rs));
}

function calcMACD(closes) {
  const ema12 = calcEMA(closes, 12);
  const ema26 = calcEMA(closes, 26);
  if (ema12.length === 0 || ema26.length === 0) return { line: 0, signal: 0, histogram: 0, prevHistogram: 0, histRising: false };
  const offset = ema12.length - ema26.length;
  const macdLine = [];
  for (let i = 0; i < ema26.length; i++) {
    macdLine.push(ema12[i + offset] - ema26[i]);
  }
  const signalLine = calcEMA(macdLine, 9);
  if (signalLine.length === 0) return { line: macdLine[macdLine.length-1]||0, signal: 0, histogram: 0, prevHistogram: 0, histRising: false };
  const ml = macdLine[macdLine.length - 1];
  const sl = signalLine[signalLine.length - 1];
  const prevMl = macdLine.length > 1 ? macdLine[macdLine.length - 2] : ml;
  const prevSl = signalLine.length > 1 ? signalLine[signalLine.length - 2] : sl;
  const hist = ml - sl;
  const prevHist = prevMl - prevSl;
  return { line: ml, signal: sl, histogram: hist, prevHistogram: prevHist, histRising: Math.abs(hist) > Math.abs(prevHist) && Math.sign(hist) === Math.sign(prevHist) };
}

function calcVWAP(timestamps, highs, lows, closes, volumes) {
  let cumTPV = 0, cumVol = 0;
  let lastDay = -1;
  const vwaps = [];
  for (let i = 0; i < timestamps.length; i++) {
    const d = new Date(timestamps[i] * 1000);
    const day = d.getUTCDay() * 1000 + d.getUTCDate();
    if (day !== lastDay) { cumTPV = 0; cumVol = 0; lastDay = day; }
    const tp = (highs[i] + lows[i] + closes[i]) / 3;
    cumTPV += tp * volumes[i];
    cumVol += volumes[i];
    vwaps.push(cumVol > 0 ? cumTPV / cumVol : closes[i]);
  }
  return vwaps;
}

function calcATR(highs, lows, closes, period = 14) {
  if (highs.length < period + 1) return null;
  let atr = 0;
  for (let i = 1; i <= period; i++) {
    const tr = Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i-1]), Math.abs(lows[i] - closes[i-1]));
    atr += tr;
  }
  atr /= period;
  for (let i = period + 1; i < highs.length; i++) {
    const tr = Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i-1]), Math.abs(lows[i] - closes[i-1]));
    atr = (atr * (period - 1) + tr) / period;
  }
  return atr;
}

// Wilder's ADX — trend STRENGTH regardless of direction.
// Below ~18 = no real trend (chop/range). Above 25 = strong trend.
function calcADX(highs, lows, closes, period = 14) {
  if (highs.length < period * 2 + 2) return null;
  const plusDM = [], minusDM = [], tr = [];
  for (let i = 1; i < highs.length; i++) {
    const up = highs[i] - highs[i - 1];
    const dn = lows[i - 1] - lows[i];
    plusDM.push(up > dn && up > 0 ? up : 0);
    minusDM.push(dn > up && dn > 0 ? dn : 0);
    tr.push(Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i - 1]), Math.abs(lows[i] - closes[i - 1])));
  }
  // Wilder smoothing
  let sTR = tr.slice(0, period).reduce((a, b) => a + b, 0);
  let sP = plusDM.slice(0, period).reduce((a, b) => a + b, 0);
  let sM = minusDM.slice(0, period).reduce((a, b) => a + b, 0);
  const dxs = [];
  for (let i = period; i < tr.length; i++) {
    sTR = sTR - sTR / period + tr[i];
    sP = sP - sP / period + plusDM[i];
    sM = sM - sM / period + minusDM[i];
    const pDI = sTR > 0 ? (sP / sTR) * 100 : 0;
    const mDI = sTR > 0 ? (sM / sTR) * 100 : 0;
    const dx = (pDI + mDI) > 0 ? Math.abs(pDI - mDI) / (pDI + mDI) * 100 : 0;
    dxs.push(dx);
  }
  if (dxs.length < period) return null;
  let adx = dxs.slice(0, period).reduce((a, b) => a + b, 0) / period;
  for (let i = period; i < dxs.length; i++) adx = (adx * (period - 1) + dxs[i]) / period;
  return adx;
}

// Fraction of the regular trading session (9:30-4:00 ET) elapsed right now.
// Returns 1 outside market hours (the latest daily bar is then complete).
function sessionElapsedFraction() {
  try {
    const et = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
    const day = et.getDay();
    if (day === 0 || day === 6) return 1; // weekend
    const mins = et.getHours() * 60 + et.getMinutes();
    const open = 9 * 60 + 30, close = 16 * 60;
    if (mins <= open || mins >= close) return 1;
    // Floor at 10% — the first few minutes have outsized volume anyway
    return Math.max(0.1, (mins - open) / (close - open));
  } catch(e) { return 1; }
}

// ═══════════════════════════════════════════════════════════════
// SIGNAL ENGINE v2 — Tuned for anti-chase, day/swing trades
//
// 8 signals, no redundancy. Each answers a distinct question:
//   1. Volume + volume trend (22) → Is this move real & still building?
//   2. VWAP position (18) → Am I chasing an extension?
//   3. Sector confirmation (16) → Does the broader market agree?
//   4. MACD momentum direction (14) → Is the engine accelerating or dying?
//   5. ATR remaining (12) → Is there room left to run today?
//   6. RSI dual timeframe (10) → Am I too late on any timeframe?
//   7. Trend alignment (10) → Is the overall direction confirmed?
//   8. Previous day levels (8) → Has a key structural level broken?
// ═══════════════════════════════════════════════════════════════

async function analyzeSymbol(sym) {
  const [intraday, daily, fhQuote] = await Promise.all([
    getIntraday(sym),
    getDaily(sym),
    getFinnhubQuote(sym)
  ]);

  if (!daily || !daily.timestamp || daily.timestamp.length < 21) {
    throw new Error(daily ? 'Not enough data — check the symbol'
      : `Price data unavailable (all CORS proxies failed${lastProxyError ? ', last: ' + lastProxyError : ''}) — set your own proxy URL`);
  }

  const dq = daily.indicators.quote[0];
  const dCloses = dq.close.filter(v => v != null);
  const dHighs = dq.high.filter(v => v != null);
  const dLows = dq.low.filter(v => v != null);
  const dVolumes = dq.volume.filter(v => v != null);

  // Current price
  let price = fhQuote?.c || dCloses[dCloses.length - 1];
  let prevClose = fhQuote?.pc || dCloses[dCloses.length - 2];
  let dayChange = price - prevClose;
  let dayChangePct = (dayChange / prevClose) * 100;
  let dayHigh = fhQuote?.h || dHighs[dHighs.length - 1];
  let dayLow = fhQuote?.l || dLows[dLows.length - 1];

  // ── Calculate everything ──
  const ema9 = calcEMA(dCloses, 9);
  const ema21 = calcEMA(dCloses, 21);
  const sma20 = calcSMA(dCloses, 20);
  const dailyRsi = calcRSI(dCloses, 14);
  const macd = calcMACD(dCloses);
  const atr = calcATR(dHighs, dLows, dCloses, 14);

  const curEma9 = ema9[ema9.length - 1];
  const curEma21 = ema21[ema21.length - 1];
  const curSma20 = sma20[sma20.length - 1];
  const prevEma9 = ema9.length > 1 ? ema9[ema9.length - 2] : curEma9;
  const prevEma21 = ema21.length > 1 ? ema21[ema21.length - 2] : curEma21;

  const prevDayHigh = dHighs[dHighs.length - 2];
  const prevDayLow = dLows[dLows.length - 2];

  // Volume: 20-day average, PACE-ADJUSTED for time of day.
  // At 10 AM only ~8% of the session has elapsed, so raw today-vs-average
  // comparison would read absurdly low all morning. Project today's volume
  // to a full session before comparing.
  const recentVols = dVolumes.slice(-21, -1);
  const avgVol = recentVols.reduce((a, b) => a + b, 0) / recentVols.length;
  const todayVol = dVolumes[dVolumes.length - 1];
  const sessionFrac = sessionElapsedFraction();
  const relVol = (todayVol / sessionFrac) / avgVol;

  // Today's range vs ATR
  const todayRange = dayHigh - dayLow;
  const atrRemaining = atr ? Math.max(0, 1 - (todayRange / atr)) : null;
  const atrUsedPct = atr ? (todayRange / atr) * 100 : null;

  // Intraday data: VWAP, volume trend, 30m RSI
  let vwap = null, priceVsVwap = 0, volTrend = null, intradayRsi = null;
  if (intraday && intraday.timestamp && intraday.timestamp.length > 4) {
    const iq = intraday.indicators.quote[0];
    const iTs = intraday.timestamp;
    const iH = iq.high, iL = iq.low, iC = iq.close, iV = iq.volume;

    // VWAP
    const vwaps = calcVWAP(iTs, iH, iL, iC, iV);
    vwap = vwaps[vwaps.length - 1];
    priceVsVwap = ((price - vwap) / vwap) * 100;

    // Volume trend: compare last 3 COMPLETED bars to the 3 before them.
    // The final bar is in progress (partial volume) — including it makes
    // volume always look like it's fading early in each 30-min bar.
    const cleanVols = iV.filter(v => v != null && v > 0);
    if (cleanVols.length >= 7) {
      const recent3 = cleanVols.slice(-4, -1).reduce((a,b) => a+b, 0) / 3;
      const prior3 = cleanVols.slice(-7, -4).reduce((a,b) => a+b, 0) / 3;
      volTrend = prior3 > 0 ? (recent3 / prior3) : null;
    }

    // 30-minute RSI
    const cleanCloses = iC.filter(v => v != null);
    if (cleanCloses.length > 14) {
      intradayRsi = calcRSI(cleanCloses, 14);
    }
  }

  // ═══════════════════════════════════════════════════════════
  // LAYER 1 — TREND REGIME (slow, stable)
  // Computed from COMPLETED daily bars only, so it cannot change
  // during the trading day. Answers: uptrend, downtrend, or no-trend?
  // ═══════════════════════════════════════════════════════════

  // Completed bars: exclude today's in-progress daily bar if present
  const nowEtDate = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' })).toDateString();
  const lastBarDate = new Date(daily.timestamp[daily.timestamp.length - 1] * 1000).toLocaleString('en-US', { timeZone: 'America/New_York' });
  const lastIsToday = new Date(lastBarDate).toDateString() === nowEtDate;
  const cCloses = lastIsToday ? dCloses.slice(0, -1) : dCloses;
  const cHighs  = lastIsToday ? dHighs.slice(0, -1)  : dHighs;
  const cLows   = lastIsToday ? dLows.slice(0, -1)   : dLows;

  const tEma9 = calcEMA(cCloses, 9), tEma21 = calcEMA(cCloses, 21);
  const tSma20 = calcSMA(cCloses, 20), tSma50 = cCloses.length >= 50 ? calcSMA(cCloses, 50) : null;
  const tMacd = calcMACD(cCloses);
  const adx = calcADX(cHighs, cLows, cCloses, 14);
  const lastClose = cCloses[cCloses.length - 1];

  const trendReasons = [];
  let trendScore = 0; // -100..+100

  // EMA structure (±25)
  const te9 = tEma9[tEma9.length-1], te21 = tEma21[tEma21.length-1];
  const pe9 = tEma9[tEma9.length-2], pe21 = tEma21[tEma21.length-2];
  let emaBull = 0;
  if (te9 > te21) emaBull++;
  if (te9 > pe9) emaBull++;
  if (te21 > pe21) emaBull++;
  trendScore += (emaBull - 1.5) / 1.5 * 25;
  if (emaBull === 3) trendReasons.push({ text: 'Moving averages stacked bullish and rising', type: 'bull' });
  else if (emaBull === 0) trendReasons.push({ text: 'Moving averages stacked bearish and falling', type: 'bear' });

  // Price vs SMA20/50 (±20)
  let maScore = 0;
  if (lastClose > tSma20[tSma20.length-1]) maScore += 10; else maScore -= 10;
  if (tSma50) { if (lastClose > tSma50[tSma50.length-1]) maScore += 10; else maScore -= 10; }
  else maScore *= 2;
  trendScore += maScore;
  if (maScore >= 20) trendReasons.push({ text: 'Price above both the 20-day and 50-day averages', type: 'bull' });
  else if (maScore <= -20) trendReasons.push({ text: 'Price below both the 20-day and 50-day averages', type: 'bear' });

  // Market structure: higher highs / higher lows over last 10 days (±20)
  let hh = 0, hl = 0, lh = 0, ll = 0;
  for (let i = Math.max(1, cHighs.length - 10); i < cHighs.length; i++) {
    if (cHighs[i] > cHighs[i-1]) hh++; else lh++;
    if (cLows[i] > cLows[i-1]) hl++; else ll++;
  }
  const structNet = (hh + hl) - (lh + ll);
  trendScore += Math.max(-20, Math.min(20, structNet * 2.5));
  if (structNet >= 8) trendReasons.push({ text: 'Making higher highs and higher lows — classic uptrend structure', type: 'bull' });
  else if (structNet <= -8) trendReasons.push({ text: 'Making lower highs and lower lows — classic downtrend structure', type: 'bear' });

  // Daily MACD (±20)
  if (tMacd.histogram > 0) trendScore += tMacd.histRising ? 20 : 10;
  else if (tMacd.histogram < 0) trendScore += tMacd.histRising ? -20 : -10;
  if (tMacd.histogram > 0 && tMacd.histRising) trendReasons.push({ text: 'Daily momentum positive and building', type: 'bull' });
  else if (tMacd.histogram < 0 && tMacd.histRising) trendReasons.push({ text: 'Daily momentum negative and getting worse', type: 'bear' });

  // 5-day rate of change (±15)
  if (cCloses.length >= 6) {
    const roc5 = ((lastClose - cCloses[cCloses.length-6]) / cCloses[cCloses.length-6]) * 100;
    trendScore += Math.max(-15, Math.min(15, roc5 * 3));
    if (roc5 > 2.5) trendReasons.push({ text: `Up ${roc5.toFixed(1)}% over the last 5 days`, type: 'bull' });
    else if (roc5 < -2.5) trendReasons.push({ text: `Down ${Math.abs(roc5).toFixed(1)}% over the last 5 days`, type: 'bear' });
  }

  trendScore = Math.max(-100, Math.min(100, trendScore));

  // ── Regime with hysteresis (persisted per symbol) ──
  const regimes = JSON.parse(localStorage.getItem('ts_regimes') || '{}');
  const prevRegime = regimes[sym]?.regime || 'RANGE';
  let regime;
  const adxOk = adx == null || adx >= 18;
  const adxDead = adx != null && adx < 15;
  if (prevRegime === 'UP') {
    regime = (trendScore >= 15 && !adxDead) ? 'UP' : (trendScore <= -30 && adxOk ? 'DOWN' : 'RANGE');
  } else if (prevRegime === 'DOWN') {
    regime = (trendScore <= -15 && !adxDead) ? 'DOWN' : (trendScore >= 30 && adxOk ? 'UP' : 'RANGE');
  } else {
    regime = (trendScore >= 30 && adxOk) ? 'UP' : (trendScore <= -30 && adxOk) ? 'DOWN' : 'RANGE';
  }
  if (adx != null && adx < 15 && regime !== 'RANGE' && Math.abs(trendScore) < 45) {
    regime = 'RANGE';
    trendReasons.push({ text: `Trend strength very weak (ADX ${adx.toFixed(0)}) — market is drifting, not trending`, type: 'neutral' });
  }
  if (regimes[sym]?.regime !== regime) {
    regimes[sym] = { regime, since: new Date().toISOString().slice(0, 10) };
    localStorage.setItem('ts_regimes', JSON.stringify(regimes));
  }
  const regimeSince = regimes[sym].since;
  const trendStrength = Math.min(95, Math.round(Math.abs(trendScore) * 0.55 + (adx || 15) * 1.4));

  // ═══════════════════════════════════════════════════════════
  // LAYER 2 — ENTRY TIMING (fast, within the regime)
  // Never contradicts the trend. Only answers: is NOW a good entry?
  // ═══════════════════════════════════════════════════════════
  const entryReasons = [];
  let entryState = 'STAND_ASIDE'; // ENTER | WAIT_LATE | WAIT_EXTENDED | WAIT_PULLBACK | WAIT_VOLUME | WAIT_HOT | STAND_ASIDE | BREAKOUT_WATCH
  let entryText = '';
  let entryTarget = null;
  let entryQuality = 0;

  const dirUp = regime === 'UP';
  const dirDn = regime === 'DOWN';
  // Extension relative to the trade direction: positive = stretched in-direction
  const ext = dirUp ? priceVsVwap : dirDn ? -priceVsVwap : Math.abs(priceVsVwap);
  const iRsiHot = intradayRsi != null && (dirUp ? intradayRsi >= 68 : intradayRsi <= 32);

  // Breakout override: RANGE regime but today is a monster move with volume —
  // flag it instead of blindly saying "no trend" all day.
  const bigMove = atr && Math.abs(price - prevClose) > 1.2 * atr && relVol > 1.3;

  if (regime === 'RANGE') {
    if (bigMove) {
      entryState = 'BREAKOUT_WATCH';
      const brDir = price > prevClose ? 'upside' : 'downside';
      entryText = `Big ${brDir} move on strong volume today — possible breakout from the range. Early entries are higher-risk; the trend flips officially if this holds into tomorrow.`;
      entryQuality = 40;
    } else {
      entryState = 'STAND_ASIDE';
      const upLevel = tSma20[tSma20.length-1];
      entryText = `No established trend — this is the chop that eats accounts. Wait for a daily close ${lastClose < upLevel ? 'above' : 'beyond'} $${upLevel.toFixed(2)} (20-day average) with volume before trading it.`;
      entryQuality = 10;
    }
  } else {
    // Within a trend: grade the entry
    entryQuality = 100;
    const vwapStr = vwap ? `$${vwap.toFixed(2)}` : 'VWAP';

    if (atrUsedPct != null && atrUsedPct >= 85) {
      entryState = 'WAIT_LATE';
      entryText = `Today's move is spent (${Math.min(atrUsedPct,199).toFixed(0)}% of typical range used). Wait for tomorrow's setup rather than buying the leftovers.`;
      entryQuality = 20;
    } else if (ext > 0.9) {
      entryState = 'WAIT_EXTENDED';
      entryText = `Price is stretched ${Math.abs(priceVsVwap).toFixed(1)}% ${dirUp ? 'above' : 'below'} VWAP — entering here is chasing. A pullback toward ${vwapStr} is the entry.`;
      entryTarget = vwap;
      entryQuality = 35;
    } else if (ext < -0.5) {
      entryState = 'WAIT_PULLBACK';
      entryText = `Deep pullback in progress (${Math.abs(priceVsVwap).toFixed(1)}% ${dirUp ? 'below' : 'above'} VWAP). Don't catch the knife — wait for price to reclaim ${vwapStr}.`;
      entryTarget = vwap;
      entryQuality = 30;
    } else if (relVol < 0.85) {
      entryState = 'WAIT_VOLUME';
      entryText = `Trend is intact but today's volume is only ${relVol.toFixed(1)}x normal pace — moves without participation fade. Wait for volume to show up.`;
      entryQuality = 40;
    } else if (iRsiHot) {
      entryState = 'WAIT_HOT';
      entryText = `Short-term momentum is maxed (30-min RSI ${intradayRsi.toFixed(0)}). Let it cool for a bar or two — entries here usually get a better price within the hour.`;
      entryQuality = 45;
    } else {
      entryState = 'ENTER';
      entryQuality = 75;
      if (ext >= -0.2 && ext <= 0.6) entryQuality += 10;
      if (volTrend != null && volTrend > 1.15) { entryQuality += 10; entryReasons.push({ text: 'Volume building bar over bar — fresh participation', type: dirUp ? 'bull' : 'bear' }); }
      if (relVol >= 1.3) entryQuality += 5;
      entryQuality = Math.min(95, entryQuality);
      entryText = `Price is near VWAP with the trend at your back — this is the entry zone. ${dirUp ? 'Buy the bull side' : 'Buy the inverse/bear side'} with a stop ${(0.75 * (atr||0)).toFixed(2) !== '0.00' ? `about $${(0.75*atr).toFixed(2)} away` : 'below recent support'}.`;
    }

    // Entry context reasons
    if (Math.abs(priceVsVwap) <= 0.9 && vwap) entryReasons.push({ text: `Price within ${Math.abs(priceVsVwap).toFixed(1)}% of VWAP ($${vwap.toFixed(2)})`, type: 'neutral' });
    if (atrUsedPct != null && atrUsedPct < 60) entryReasons.push({ text: `${Math.max(0,100-atrUsedPct).toFixed(0)}% of the typical daily range still available`, type: dirUp ? 'bull' : 'bear' });
    if (price > prevDayHigh && dirUp) entryReasons.push({ text: `Broke above yesterday's high ($${prevDayHigh.toFixed(2)})`, type: 'bull' });
    if (price < prevDayLow && dirDn) entryReasons.push({ text: `Broke below yesterday's low ($${prevDayLow.toFixed(2)})`, type: 'bear' });
  }

  const isInverse = IS_INVERSE.has(sym);

  // trendBull retained for metric tile compatibility
  const trendBull = emaBull + (lastClose > tSma20[tSma20.length-1] ? 1 : 0);

  return {
    sym, price, dayChange, dayChangePct, dayHigh, dayLow, isInverse,
    regime, regimeSince, trendScore, trendStrength, adx,
    entryState, entryText, entryTarget, entryQuality,
    trendReasons, entryReasons,
    blockers: [],
    metrics: {
      vwap, priceVsVwap,
      relVol, volTrend,
      dailyRsi, intradayRsi,
      macdHist: tMacd.histogram, macdHistRising: tMacd.histRising,
      atrUsedPct, atr, todayRange,
      trendBull, ema9: te9, ema21: te21, sma20: tSma20[tSma20.length-1],
      prevDayHigh, prevDayLow
    }
  };
}

// Get sector/index confirmation
async function getSectorSignal(sym) {
  const ref = SECTOR_MAP[sym];
  if (!ref || ref === sym) return null;
  try {
    const fq = await getFinnhubQuote(ref);
    if (!fq) return null;
    const change = ((fq.c - fq.pc) / fq.pc) * 100;
    return { sym: ref, price: fq.c, change };
  } catch(e) { return null; }
}

// ═══════════════════════════════════════════════════════════════
// POSITION TRACKER + EXIT SIGNALS
// ═══════════════════════════════════════════════════════════════

function getPositions() {
  return JSON.parse(localStorage.getItem('ts_positions') || '{}');
}

function savePositions(pos) {
  localStorage.setItem('ts_positions', JSON.stringify(pos));
}

function enterPosition(watchSym) {
  const tickerInput = document.getElementById(`pos-ticker-${watchSym}`);
  const priceInput = document.getElementById(`pos-price-${watchSym}`);
  const ticker = (tickerInput?.value || watchSym).trim().toUpperCase();
  const entryPrice = parseFloat(priceInput?.value);
  if (!ticker || isNaN(entryPrice) || entryPrice <= 0) return;

  // Determine thesis and leverage from SYMBOL_INFO
  // thesis = bull/bear view on the underlying (for exit signal logic)
  // You always BUY shares, so stops always go below your price
  const info = SYMBOL_INFO[ticker];
  const isInverse = IS_INVERSE.has(ticker);
  const leverage = info?.leverage || 1;
  const thesis = isInverse ? 'short' : 'long';

  const positions = getPositions();
  positions[watchSym] = {
    ticker,
    entryPrice,
    thesis,
    leverage,
    timestamp: Date.now()
  };
  savePositions(positions);

  // Re-render this card
  refreshSymbol(watchSym);
}

function exitPosition(watchSym) {
  const positions = getPositions();
  delete positions[watchSym];
  savePositions(positions);
  refreshSymbol(watchSym);
}

function calcExitSignal(position, data, sectorData, tradedPrice) {
  const { ticker, entryPrice, leverage } = position;
  // 'thesis' = bull/bear view on the underlying (for interpreting indicator signals)
  // Support old saved positions that used 'direction'
  const direction = position.thesis || position.direction;
  const { price, metrics } = data;

  // Use the actual traded ticker's price for P&L
  const actualPrice = tradedPrice || price;

  // P&L — you always BUY shares, so this is straightforward
  const positionMove = ((actualPrice - entryPrice) / entryPrice) * 100;

  // Trailing stop always goes BELOW the traded price (you own shares, you lose if price drops)
  const scaledAtr = metrics.atr ? metrics.atr * leverage : null;
  const stopDistance = scaledAtr ? scaledAtr * 0.75 : null;
  let stopPrice = null;
  if (stopDistance) {
    stopPrice = actualPrice - stopDistance;
  }

  // ── Exit signal logic ──
  const exitReasons = [];
  let exitScore = 0; // positive = reasons to exit, negative = reasons to hold

  // 1. VWAP crossed against position
  if (direction === 'long' && metrics.priceVsVwap < -0.15) {
    exitScore += 25;
    exitReasons.push('Price dropped below VWAP — buyers lost control');
  } else if (direction === 'short' && metrics.priceVsVwap > 0.15) {
    exitScore += 25;
    exitReasons.push('Price climbed above VWAP — sellers lost control');
  }

  // 2. Volume dying
  if (metrics.volTrend != null && metrics.volTrend < 0.6) {
    exitScore += 20;
    exitReasons.push('Volume fading fast — the move is losing conviction');
  }

  // 3. MACD decelerating against position
  if (direction === 'long' && metrics.macdHist > 0 && !metrics.macdHistRising) {
    exitScore += 15;
    exitReasons.push('Momentum positive but slowing — about to roll over');
  } else if (direction === 'long' && metrics.macdHist < 0) {
    exitScore += 25;
    exitReasons.push('Momentum flipped negative — trend reversing');
  } else if (direction === 'short' && metrics.macdHist < 0 && !metrics.macdHistRising) {
    exitScore += 15;
    exitReasons.push('Downward momentum slowing — sellers running out of steam');
  } else if (direction === 'short' && metrics.macdHist > 0) {
    exitScore += 25;
    exitReasons.push('Momentum flipped positive — downtrend reversing');
  }

  // 4. RSI extreme
  const rsi = metrics.intradayRsi || metrics.dailyRsi;
  if (direction === 'long' && rsi && rsi > 78) {
    exitScore += 20;
    exitReasons.push(`RSI at ${rsi.toFixed(0)} — take profit before the snapback`);
  } else if (direction === 'short' && rsi && rsi < 25) {
    exitScore += 20;
    exitReasons.push(`RSI at ${rsi.toFixed(0)} — oversold, bounce incoming`);
  }

  // 5. Range exhaustion
  if (metrics.atrUsedPct && metrics.atrUsedPct > 90) {
    exitScore += 15;
    exitReasons.push(`${metrics.atrUsedPct.toFixed(0)}% of daily range used — nowhere left to go today`);
  }

  // 6. Trend regime flipped against the position — strongest exit signal
  if (data.regime) {
    if ((direction === 'long' && data.regime === 'DOWN') || (direction === 'short' && data.regime === 'UP')) {
      exitScore += 40;
      exitReasons.push('The trend itself has flipped against your position — this is no longer a pullback, it\'s a reversal');
    } else if (data.regime === 'RANGE') {
      exitScore += 12;
      exitReasons.push('Trend has faded into a range — the reason for the trade is gone');
    }
  }

  // 7. Sector divergence
  if (sectorData) {
    const sectorAgainst = (direction === 'long' && sectorData.change < -0.3) || (direction === 'short' && sectorData.change > 0.3);
    if (sectorAgainst) {
      exitScore += 15;
      exitReasons.push(`${sectorData.sym} moving against your position (${sectorData.change > 0 ? '+' : ''}${sectorData.change.toFixed(2)}%)`);
    }
  }

  // 7. In profit + momentum fading = take profit
  if (positionMove > 2 && exitScore >= 15) {
    exitScore += 10;
    exitReasons.push(`Up ${positionMove.toFixed(1)}% with warning signs — lock in gains`);
  }

  // 8. Reasons to HOLD
  const holdReasons = [];
  if (direction === 'long' && metrics.priceVsVwap > 0.1 && metrics.priceVsVwap < 0.8) {
    holdReasons.push('Still in healthy VWAP zone');
  } else if (direction === 'short' && metrics.priceVsVwap < -0.1 && metrics.priceVsVwap > -0.8) {
    holdReasons.push('Still in healthy VWAP zone');
  }
  if (metrics.volTrend != null && metrics.volTrend > 1.1) {
    holdReasons.push('Volume still building');
  }
  if ((direction === 'long' && metrics.macdHist > 0 && metrics.macdHistRising) || (direction === 'short' && metrics.macdHist < 0 && metrics.macdHistRising)) {
    holdReasons.push('Momentum still accelerating');
  }
  if (metrics.atrUsedPct && metrics.atrUsedPct < 60) {
    holdReasons.push(`${Math.max(0, 100 - metrics.atrUsedPct).toFixed(0)}% of daily range still available`);
  }

  // Determine signal
  let exitSignal, exitClass;
  if (exitScore >= 50) {
    exitSignal = 'EXIT';
    exitClass = 'exit';
  } else if (exitScore >= 25) {
    exitSignal = 'CAUTION';
    exitClass = 'caution';
  } else {
    exitSignal = 'HOLD';
    exitClass = 'hold';
  }

  return {
    signal: exitSignal,
    exitClass,
    exitReasons: exitScore >= 25 ? exitReasons : [],
    holdReasons: exitScore < 50 ? holdReasons : [],
    pnl: { positionMove },
    tradedPrice: actualPrice,
    stopPrice
  };
}

// ═══════════════════════════════════════════════════════════════
// UI RENDERING
// ═══════════════════════════════════════════════════════════════

function renderCard(data, sectorData) {
  const { sym, price, dayChange, dayChangePct, regime, regimeSince, trendStrength, adx,
          entryState, entryText, entryQuality, trendReasons, entryReasons, metrics, isInverse } = data;
  // Card accent + badge derive from the REGIME (stable), not intraday state
  const sig = regime === 'UP' ? 'buy' : regime === 'DOWN' ? 'sell' : 'wait';
  const changeClass = dayChange >= 0 ? 'up' : 'down';
  const changeSign = dayChange >= 0 ? '+' : '';

  const regimeLabel = regime === 'UP' ? 'UPTREND' : regime === 'DOWN' ? 'DOWNTREND' : 'NO TREND';
  // Days in regime
  let sinceTxt = '';
  if (regimeSince) {
    const days = Math.max(0, Math.round((Date.now() - new Date(regimeSince + 'T12:00:00')) / 86400000));
    sinceTxt = days === 0 ? 'new today' : `${days} day${days === 1 ? '' : 's'}`;
  }

  const entryBadges = {
    ENTER:          { label: regime === 'UP' ? 'BUY ZONE' : 'ENTER (INVERSE)', cls: sig },
    WAIT_EXTENDED:  { label: 'WAIT — EXTENDED', cls: 'wait' },
    WAIT_PULLBACK:  { label: 'WAIT — PULLBACK', cls: 'wait' },
    WAIT_VOLUME:    { label: 'WAIT — VOLUME', cls: 'wait' },
    WAIT_HOT:       { label: 'WAIT — OVERHEATED', cls: 'wait' },
    WAIT_LATE:      { label: 'TOO LATE TODAY', cls: 'wait' },
    WAIT_SECTOR:    { label: 'WAIT — INDEX', cls: 'wait' },
    STAND_ASIDE:    { label: 'STAY OUT', cls: 'wait' },
    BREAKOUT_WATCH: { label: 'BREAKOUT WATCH', cls: 'wait' },
  };
  const eb = entryBadges[entryState] || entryBadges.STAND_ASIDE;

  let html = `
    <div class="card ${sig}" id="card-${sym}" draggable="true">
      <div class="card-head">
        <div>
          <div class="card-sym">${sym}</div>
          <div class="card-price">$${price.toFixed(2)} <span class="card-change ${changeClass}">${changeSign}${dayChange.toFixed(2)} (${changeSign}${dayChangePct.toFixed(2)}%)</span></div>
        </div>
        <div class="card-actions">
          <div class="card-move-group">
            <button class="card-move" onclick="moveSymbol('${sym}',-1)" title="Move up">▲</button>
            <button class="card-move" onclick="moveSymbol('${sym}',1)" title="Move down">▼</button>
          </div>
          <button class="card-refresh" onclick="refreshSymbol('${sym}',this)" title="Refresh">↻</button>
          <button class="card-remove" onclick="removeSymbol('${sym}')" title="Remove">✕</button>
        </div>
      </div>`;

  // Symbol info section
  const info = SYMBOL_INFO[sym];
  if (info) {
    const typeLabels = { letf:'Leveraged ETF', ietf:'Inverse ETF', etf:'ETF', stock:'Stock' };
    html += `<div class="sym-info">`;
    html += `<div class="sym-info-name">${info.name}</div>`;
    html += `<div class="sym-info-tags">`;
    html += `<span class="sym-tag ${info.type}">${typeLabels[info.type]}</span>`;
    html += `<span class="sym-tag sector">${info.sector}</span>`;
    if (info.leverage > 1) html += `<span class="sym-tag leverage">${info.leverage}x Leverage</span>`;
    if (info.type === 'ietf') html += `<span class="sym-tag direction-bear">Inverse</span>`;
    html += `</div>`;
    html += `<div class="sym-info-desc">${info.desc}</div>`;
    if (info.underlying) {
      const dirWord = info.direction === 'bear' ? 'inversely to' : 'with';
      const leverageWord = info.leverage > 1 ? ` at ${info.leverage}x the daily move` : '';
      html += `<div class="sym-info-underlying">Derived from <strong>${info.underlying}</strong> — moves ${dirWord} ${info.underlying}${leverageWord}</div>`;
    }
    html += `</div>`;
  }

  // ── Trend regime row (slow layer) ──
  html += `
      <div class="signal-row">
        <div class="signal-badge ${sig}">${regimeLabel}</div>
        <div class="confidence"><strong>${trendStrength}%</strong> trend strength${sinceTxt ? ` · <span style="color:var(--text3)">${sinceTxt}</span>` : ''}${adx != null ? ` · <span style="color:var(--text3)">ADX ${adx.toFixed(0)}</span>` : ''}</div>
      </div>`;

  // ── Entry timing row (fast layer) ──
  html += `
      <div class="signal-row" style="padding-top:0;">
        <div class="signal-badge ${eb.cls}" style="font-size:0.78rem;padding:5px 14px;">${eb.label}</div>
        <div class="confidence" style="font-size:0.78rem;">entry quality <strong>${entryQuality}%</strong>${data._pendingState ? ' · <span style="color:var(--text3)">shifting…</span>' : ''}</div>
      </div>`;

  // Entry guidance text
  if (entryText) {
    const gClass = entryState === 'ENTER' ? (sig === 'buy' ? 'hold' : 'hold') : entryState === 'BREAKOUT_WATCH' ? 'caution' : 'caution';
    html += `<div class="exit-signal ${entryState === 'ENTER' ? 'hold' : 'caution'}" style="margin-top:0;">
      <span class="exit-icon">${entryState === 'ENTER' ? '✓' : entryState === 'BREAKOUT_WATCH' ? '⚡' : 'ℹ'}</span>
      <div>${entryText}</div>
    </div>`;
  }

  // Reasons: trend evidence + entry timing
  html += `<div class="reasons">`;
  const tR = trendReasons.filter(r => r.type !== 'neutral').slice(0, 3).concat(trendReasons.filter(r => r.type === 'neutral').slice(0, 1));
  const eR = entryReasons.slice(0, 3);
  tR.forEach(r => {
    const ic = r.type === 'bull' ? '▲' : r.type === 'bear' ? '▼' : '●';
    html += `<div class="reason"><span class="reason-icon ${r.type}">${ic}</span>${r.text}</div>`;
  });
  if (eR.length) {
    html += `<div class="reason" style="margin-top:4px;color:var(--text3);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;">Entry timing</div>`;
    eR.forEach(r => {
      const ic = r.type === 'bull' ? '▲' : r.type === 'bear' ? '▼' : '●';
      html += `<div class="reason"><span class="reason-icon ${r.type}">${ic}</span>${r.text}</div>`;
    });
  }
  html += `</div>`;

  // Metrics — new indicator set
  const vwapClass = !metrics.vwap ? 'neutral' : (Math.abs(metrics.priceVsVwap) > 1.2 ? 'bear' : metrics.priceVsVwap > 0.1 ? 'bull' : metrics.priceVsVwap < -0.1 ? 'bear' : 'neutral');
  const volClass = metrics.relVol > 1.3 ? 'bull' : metrics.relVol < 0.7 ? 'bear' : 'neutral';
  const volTrendClass = metrics.volTrend == null ? 'neutral' : (metrics.volTrend > 1.15 ? 'bull' : metrics.volTrend < 0.7 ? 'bear' : 'neutral');
  const macdClass = metrics.macdHist > 0 ? (metrics.macdHistRising ? 'bull' : 'neutral') : (metrics.macdHistRising ? 'bear' : 'neutral');
  const atrClass = metrics.atrUsedPct == null ? 'neutral' : (metrics.atrUsedPct < 50 ? 'bull' : metrics.atrUsedPct > 80 ? 'bear' : 'neutral');
  const rsiVal = metrics.intradayRsi || metrics.dailyRsi;
  const rsiClass = !rsiVal ? 'neutral' : (rsiVal >= 65 ? 'bear' : rsiVal <= 35 ? 'bull' : rsiVal >= 40 && rsiVal <= 58 ? 'bull' : 'neutral');
  const trendClass = metrics.trendBull >= 3 ? 'bull' : metrics.trendBull <= 1 ? 'bear' : 'neutral';
  const trendLabel = metrics.trendBull >= 4 ? '▲ Strong' : metrics.trendBull === 3 ? '▲ Mostly' : metrics.trendBull <= 0 ? '▼ Strong' : metrics.trendBull === 1 ? '▼ Mostly' : '— Mixed';

  // RSI display: show both if available
  let rsiDisplay = 'N/A';
  if (metrics.intradayRsi && metrics.dailyRsi) {
    rsiDisplay = `${metrics.intradayRsi.toFixed(0)} / ${metrics.dailyRsi.toFixed(0)}`;
  } else if (metrics.dailyRsi) {
    rsiDisplay = metrics.dailyRsi.toFixed(0);
  }

  html += `
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">VWAP</div>
          <div class="metric-val ${vwapClass}">${metrics.vwap ? (metrics.priceVsVwap > 0 ? '+' : '') + metrics.priceVsVwap.toFixed(2) + '%' : 'N/A'}</div>
          <div class="tip">Where price is vs today's volume-weighted average price. Slightly above (0-0.7%) is good buying territory. Over 1.2% means stretched — that's chase territory where reversals happen. Works the same way below for shorts.</div>
        </div>
        <div class="metric">
          <div class="metric-label">Volume</div>
          <div class="metric-val ${volClass}">${metrics.relVol.toFixed(1)}x</div>
          <div class="tip">Today's volume vs the 20-day average, adjusted for time of day — at 10 AM it projects what today's full volume would be at the current pace, so morning readings are meaningful. Above 1.5x means real money is behind this move. Below 0.7x means the price action is unreliable.</div>
        </div>
        <div class="metric">
          <div class="metric-label">Vol Flow</div>
          <div class="metric-val ${volTrendClass}">${metrics.volTrend != null ? (metrics.volTrend > 1 ? '▲ ' : '▼ ') + metrics.volTrend.toFixed(2) + 'x' : 'N/A'}</div>
          <div class="tip">Are the last few 30-min bars getting more or less volume than the ones before? Rising = fresh money still coming in, the move has legs. Falling = buyers/sellers are done, you'd be the last one in.</div>
        </div>
        <div class="metric">
          <div class="metric-label">MACD</div>
          <div class="metric-val ${macdClass}">${metrics.macdHist > 0 ? '+' : ''}${metrics.macdHist.toFixed(3)} ${metrics.macdHistRising ? '▲' : '▼'}</div>
          <div class="tip">Momentum speed and direction. The number shows strength, the arrow shows if it's accelerating (▲) or decelerating (▼). Positive but slowing down is a red flag — the move looks strong but the engine is dying. That's where reversals start.</div>
        </div>
        <div class="metric">
          <div class="metric-label">Range Left</div>
          <div class="metric-val ${atrClass}">${metrics.atrUsedPct != null ? Math.max(0, 100 - metrics.atrUsedPct).toFixed(0) + '%' : 'N/A'}</div>
          <div class="tip">How much of the typical daily range is still available. Based on 14-day ATR (average true range). If only 10-20% is left, the day's move is statistically over — even if direction is right, there's nowhere left to go.</div>
        </div>
        <div class="metric">
          <div class="metric-label">RSI</div>
          <div class="metric-val ${rsiClass}">${rsiDisplay}</div>
          <div class="tip">${metrics.intradayRsi ? 'Shows 30-min / daily RSI. ' : 'Daily RSI. '}Best entries are when both sit between 40-58 — momentum is building but not overheated. Above 65 on either means you're late. Above 75 means don't touch it. Below 30 means a potential bounce setup.</div>
        </div>
        <div class="metric">
          <div class="metric-label">Trend</div>
          <div class="metric-val ${trendClass}">${trendLabel}</div>
          <div class="tip">Combined read of EMA 9, EMA 21, SMA 20 direction, and their relative position. "Strong" means all four agree on direction. "Mixed" means the trend is unclear — signals in mixed trends are less reliable.</div>
        </div>
        <div class="metric">
          <div class="metric-label">Prev Day</div>
          <div class="metric-val ${price > metrics.prevDayHigh ? 'bull' : price < metrics.prevDayLow ? 'bear' : 'neutral'}">${price > metrics.prevDayHigh ? '▲ Above High' : price < metrics.prevDayLow ? '▼ Below Low' : '— In Range'}</div>
          <div class="tip">Whether price has broken above yesterday's high or below yesterday's low. These are levels that traders watch — breaking them with volume confirms a real move. Staying inside yesterday's range means no breakout yet.</div>
        </div>
      </div>`;

  // Sector reference — uses the same evidence-based logic as the scoring
  if (sectorData) {
    const sDir = sectorData.change >= 0 ? 'up' : 'down';
    const sSign = sectorData.change >= 0 ? '+' : '';
    const supports = data._sectorSupports;
    const verdict = supports === null || supports === undefined ? 'no clear read on' : (supports ? 'confirms' : 'does NOT confirm');
    html += `
      <div class="sector-ref">
        <span class="dot ${sDir}"></span>
        Reference: ${sectorData.sym} ${sSign}${sectorData.change.toFixed(2)}%
        — ${verdict} the setup${isInverse ? ' (inverse)' : ''}
      </div>`;
  }

  // ── Position Tracker ──
  const positions = getPositions();
  const pos = positions[sym];

  if (pos) {
    // Active position — show P&L and exit signals
    const tradedPrice = data._tradedTickerPrice || price; // use fetched traded price, fallback to watched price if same ticker
    const exitData = calcExitSignal(pos, data, sectorData, pos.ticker !== sym ? tradedPrice : null);
    const pnlClass = exitData.pnl.positionMove >= 0 ? 'profit' : 'loss';
    const pnlSign = exitData.pnl.positionMove >= 0 ? '+' : '';

    // Show underlying symbol's day change for context when trading a different ticker
    const showUnderlying = pos.ticker !== sym;
    const underlyingDayPct = dayChangePct;

    html += `
      <div class="position-bar in-trade">
        <div class="pos-active">
          <div class="pos-header">
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="pos-ticker-badge">${pos.ticker}</span>
              <span class="pos-direction ${pos.thesis || pos.direction}">${(pos.thesis || pos.direction) === 'long' ? 'LONG' : 'BEARISH'}</span>
              ${pos.leverage > 1 ? `<span class="pos-leverage-note">${pos.leverage}x</span>` : ''}
            </div>
            <button class="pos-btn pos-btn-exit" onclick="exitPosition('${sym}')">Close Position</button>
          </div>
          <div class="pos-pnl-row">
            <span class="pos-entry-label">Entry:</span>
            <span class="pos-entry-price">$${pos.entryPrice.toFixed(2)}</span>
            ${showUnderlying ? `<span class="pos-entry-label">Now:</span><span class="pos-entry-price">$${tradedPrice.toFixed(2)}</span>` : ''}
            <span class="pos-pnl ${pnlClass}">${pnlSign}${exitData.pnl.positionMove.toFixed(2)}%</span>
            ${showUnderlying ? `<span class="pos-leverage-note">(${sym} today ${dayChangePct >= 0 ? '+' : ''}${dayChangePct.toFixed(2)}%)</span>` : ''}
          </div>
          ${exitData.stopPrice ? `<div class="pos-stop">Trailing stop: $${exitData.stopPrice.toFixed(2)} (0.75× ATR)</div>` : ''}
        </div>
      </div>`;

    // Exit signal
    const exitIcon = exitData.signal === 'EXIT' ? '🚪' : exitData.signal === 'CAUTION' ? '⚠' : '✓';
    const reasons = exitData.signal === 'HOLD' ? exitData.holdReasons : exitData.exitReasons;
    if (reasons.length > 0) {
      html += `
        <div class="exit-signal ${exitData.exitClass}">
          <span class="exit-icon">${exitIcon}</span>
          <div>
            <strong>${exitData.signal}</strong> — ${reasons.join('. ')}.
          </div>
        </div>`;
    }
  } else {
    // No position — show entry form
    // Default ticker suggestion based on trend regime
    let suggestedTicker = sym;
    if (regime === 'UP' || regime === 'DOWN') {
      const leveragedOptions = Object.entries(SYMBOL_INFO).filter(([t, info]) =>
        info.underlying === sym && info.leverage > 1
      );
      if (leveragedOptions.length > 0) {
        const want = regime === 'UP' ? 'bull' : 'bear';
        const pick = leveragedOptions.find(([t, info]) => info.direction === want);
        if (pick) suggestedTicker = pick[0];
      }
    }

    html += `
      <div class="position-bar">
        <div class="pos-entry-form">
          <label>Trade:</label>
          <input type="text" class="pos-input pos-ticker-input" id="pos-ticker-${sym}" placeholder="${suggestedTicker}" value="${suggestedTicker !== sym ? suggestedTicker : ''}" maxlength="8">
          <label>@</label>
          <input type="number" class="pos-input" id="pos-price-${sym}" placeholder="Entry $" step="0.01">
          <button class="pos-btn pos-btn-enter" onclick="enterPosition('${sym}')">Enter</button>
        </div>
      </div>`;
  }

  // Timestamp
  html += `<div class="timestamp">Updated ${new Date().toLocaleTimeString()}</div>`;

  html += `</div>`;
  return html;
}

function renderLoading(sym) {
  return `<div class="card" id="card-${sym}" draggable="true"><div class="card-head"><div class="card-sym">${sym}</div></div><div class="card-loading"><div class="spinner"></div>Analyzing...</div></div>`;
}

function renderError(sym, msg) {
  return `<div class="card" id="card-${sym}" draggable="true"><div class="card-head"><div class="card-sym">${sym}</div><div class="card-actions"><button class="card-refresh" onclick="refreshSymbol('${sym}',this)" title="Refresh">↻</button><button class="card-remove" onclick="removeSymbol('${sym}')">✕</button></div></div><div class="card-error">${msg}</div></div>`;
}

// ═══════════════════════════════════════════════════════════════
// WATCHLIST MANAGEMENT
// ═══════════════════════════════════════════════════════════════

function saveWatchlist() {
  localStorage.setItem('ts_watchlist', JSON.stringify(watchlist));
}

function addSymbol() {
  const input = document.getElementById('symInput');
  const sym = input.value.trim().toUpperCase();
  if (!sym) return;
  if (watchlist.includes(sym)) { input.value = ''; return; }
  watchlist.unshift(sym);
  saveWatchlist();
  input.value = '';
  analyzeAndRender(sym, 'top');
}

function removeSymbol(sym) {
  watchlist = watchlist.filter(s => s !== sym);
  saveWatchlist();
  const card = document.getElementById(`card-${sym}`);
  if (card) card.remove();
}

function refreshSymbol(sym, btnEl) {
  if (btnEl) btnEl.classList.add('spinning');
  analyzeAndRender(sym);
}

function clearAll() {
  watchlist = [];
  saveWatchlist();
  document.getElementById('grid').innerHTML = '';
}

function moveSymbol(sym, dir) {
  const idx = watchlist.indexOf(sym);
  if (idx < 0) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= watchlist.length) return;
  // Swap in watchlist
  [watchlist[idx], watchlist[newIdx]] = [watchlist[newIdx], watchlist[idx]];
  saveWatchlist();
  // Swap cards in DOM
  const grid = document.getElementById('grid');
  const cards = [...grid.children];
  const cardA = document.getElementById(`card-${sym}`);
  const cardB = cards[newIdx];
  if (!cardA || !cardB || cardA === cardB) return;
  // Use insertBefore to swap
  if (dir === -1) {
    grid.insertBefore(cardA, cardB);
  } else {
    grid.insertBefore(cardB, cardA);
  }
}

// ── Custom Presets ──
function getCustomPresets() {
  return JSON.parse(localStorage.getItem('ts_custom_presets') || '{}');
}

function saveCustomPresetsToStorage(presets) {
  localStorage.setItem('ts_custom_presets', JSON.stringify(presets));
}

function saveCustomPreset() {
  const input = document.getElementById('presetNameInput');
  const name = input.value.trim();
  if (!name) return;
  if (watchlist.length === 0) return;
  const presets = getCustomPresets();
  const key = 'custom_' + name.toLowerCase().replace(/[^a-z0-9]/g, '_');
  presets[key] = { name, symbols: [...watchlist] };
  saveCustomPresetsToStorage(presets);
  input.value = '';
  renderCustomPresetButtons();
}

function deleteCustomPreset(key, e) {
  e.stopPropagation();
  const presets = getCustomPresets();
  delete presets[key];
  saveCustomPresetsToStorage(presets);
  renderCustomPresetButtons();
}

function loadCustomPreset(key) {
  const presets = getCustomPresets();
  const preset = presets[key];
  if (!preset) return;
  // Replace current list entirely with the saved preset
  watchlist = [...preset.symbols];
  saveWatchlist();
  renderAll();
}

function renderCustomPresetButtons() {
  const container = document.getElementById('customPresets');
  const presets = getCustomPresets();
  const keys = Object.keys(presets);
  if (keys.length === 0) { container.innerHTML = ''; return; }
  container.innerHTML = keys.map(key => {
    const p = presets[key];
    return `<button class="preset-btn custom" onclick="loadCustomPreset('${key}')">${p.name} (${p.symbols.length})<span class="preset-delete" onclick="deleteCustomPreset('${key}',event)" title="Delete preset">✕</span></button>`;
  }).join('');
}

// ── Drag and Drop ──
function initDragAndDrop() {
  const grid = document.getElementById('grid');
  let dragSym = null;

  grid.addEventListener('dragstart', e => {
    const card = e.target.closest('.card');
    if (!card) return;
    dragSym = card.id.replace('card-', '');
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragSym);
  });

  grid.addEventListener('dragend', e => {
    const card = e.target.closest('.card');
    if (card) card.classList.remove('dragging');
    grid.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
    dragSym = null;
  });

  grid.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const card = e.target.closest('.card');
    if (card && !card.classList.contains('dragging')) {
      grid.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
      card.classList.add('drag-over');
    }
  });

  grid.addEventListener('dragleave', e => {
    const card = e.target.closest('.card');
    if (card) card.classList.remove('drag-over');
  });

  grid.addEventListener('drop', e => {
    e.preventDefault();
    grid.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
    const targetCard = e.target.closest('.card');
    if (!targetCard || !dragSym) return;
    const targetSym = targetCard.id.replace('card-', '');
    if (targetSym === dragSym) return;

    const fromIdx = watchlist.indexOf(dragSym);
    const toIdx = watchlist.indexOf(targetSym);
    if (fromIdx < 0 || toIdx < 0) return;

    // Reorder watchlist
    watchlist.splice(fromIdx, 1);
    watchlist.splice(toIdx, 0, dragSym);
    saveWatchlist();

    // Reorder DOM
    const dragCard = document.getElementById(`card-${dragSym}`);
    if (fromIdx < toIdx) {
      targetCard.insertAdjacentElement('afterend', dragCard);
    } else {
      grid.insertBefore(dragCard, targetCard);
    }
  });
}

function loadPreset(name) {
  const syms = PRESETS[name];
  let added = 0;
  syms.forEach(s => {
    if (!watchlist.includes(s)) { watchlist.push(s); added++; }
  });
  if (added === 0) return; // all already in list
  saveWatchlist();
  renderAll();
}

async function analyzeAndRender(sym, position) {
  const grid = document.getElementById('grid');
  // Add loading card
  let existingCard = document.getElementById(`card-${sym}`);
  if (existingCard) {
    existingCard.outerHTML = renderLoading(sym);
  } else if (position === 'top') {
    grid.insertAdjacentHTML('afterbegin', renderLoading(sym));
  } else {
    grid.insertAdjacentHTML('beforeend', renderLoading(sym));
  }

  try {
    const [data, sectorData] = await Promise.all([
      analyzeSymbol(sym),
      getSectorSignal(sym)
    ]);

    // Sector check — affects ENTRY quality only, never the trend regime.
    // For inverse ETFs the supporting direction flips (DUST up wants GLD down).
    if (sectorData) {
      const inverse = IS_INVERSE.has(sym);
      const effChange = inverse ? -sectorData.change : sectorData.change;
      const tradeSign = data.regime === 'UP' ? 1 : data.regime === 'DOWN' ? -1 : 0;
      const strength = Math.abs(sectorData.change);
      let supports = null;
      if (tradeSign !== 0 && strength > 0.3) {
        supports = tradeSign * effChange > 0;
        if (supports) {
          data.entryReasons.push({ text: `${sectorData.sym} moving with the trend (${sectorData.change >= 0 ? '+' : ''}${sectorData.change.toFixed(2)}%)${inverse ? ' — inverse relationship' : ''}`, type: tradeSign > 0 ? 'bull' : 'bear' });
          data.entryQuality = Math.min(95, data.entryQuality + 5);
        } else {
          data.entryReasons.push({ text: `${sectorData.sym} moving AGAINST the trade today (${sectorData.change >= 0 ? '+' : ''}${sectorData.change.toFixed(2)}%)${inverse ? ' — inverse relationship' : ''} — entries fade when the index disagrees`, type: 'neutral' });
          data.entryQuality = Math.max(15, data.entryQuality - 25);
          if (data.entryState === 'ENTER') {
            data.entryState = 'WAIT_SECTOR';
            data.entryText = `Setup looks fine on ${sym} itself, but ${sectorData.sym} is moving against it today. Wait for the index to turn — solo moves against the reference usually fade.`;
          }
        }
      }
      data._sectorSupports = supports;
    }

    // ── Entry-state debounce: a change must persist across 2 evaluations ──
    // This stops the card from twitching between states on every refresh.
    try {
      const deb = JSON.parse(localStorage.getItem('ts_entry_debounce') || '{}');
      const d = deb[sym];
      const freshState = data.entryState;
      if (freshState === 'BREAKOUT_WATCH' || freshState === 'STAND_ASIDE' || !d || d.shown === freshState) {
        deb[sym] = { shown: freshState, pending: null, count: 0 };
      } else if (d.pending === freshState) {
        if (d.count + 1 >= 2) {
          deb[sym] = { shown: freshState, pending: null, count: 0 };
        } else {
          deb[sym] = { shown: d.shown, pending: freshState, count: d.count + 1 };
          data._pendingState = freshState;
          data.entryState = d.shown;
        }
      } else {
        deb[sym] = { shown: d.shown, pending: freshState, count: 1 };
        data._pendingState = freshState;
        data.entryState = d.shown;
      }
      localStorage.setItem('ts_entry_debounce', JSON.stringify(deb));
    } catch(e) {}

    // If there's an active position with a different ticker, fetch its current price
    const positions = getPositions();
    const activePos = positions[sym];
    let tradedTickerPrice = null;
    if (activePos && activePos.ticker !== sym) {
      const tradedQuote = await getFinnhubQuote(activePos.ticker);
      if (tradedQuote && tradedQuote.c) {
        tradedTickerPrice = tradedQuote.c;
      }
    }
    data._tradedTickerPrice = tradedTickerPrice;

    const card = document.getElementById(`card-${sym}`);
    if (card) card.outerHTML = renderCard(data, sectorData);
  } catch(e) {
    const card = document.getElementById(`card-${sym}`);
    if (card) card.outerHTML = renderError(sym, `Could not analyze: ${e.message}`);
  }
}

let renderGeneration = 0;
async function renderAll() {
  const gen = ++renderGeneration;
  document.getElementById('grid').innerHTML = '';
  // Stagger fetches to avoid overwhelming proxies
  for (let i = 0; i < watchlist.length; i++) {
    if (gen !== renderGeneration) return; // cancelled by newer renderAll
    analyzeAndRender(watchlist[i]);
    if (i % 3 === 2) await new Promise(r => setTimeout(r, 800));
  }
}

function refreshAll() {
  renderAll();
}

// Tooltip positioning — runs on hover via event delegation
document.getElementById('grid').addEventListener('mouseenter', function(e) {
  const metric = e.target.closest('.metric');
  if (!metric) return;
  const tip = metric.querySelector('.tip');
  if (!tip) return;

  // Reset classes
  tip.className = 'tip';

  // Get positions
  const metricRect = metric.getBoundingClientRect();
  const tipWidth = 220;

  // Vertical: show above unless too close to top of viewport
  if (metricRect.top < 140) {
    tip.classList.add('pos-below');
  } else {
    tip.classList.add('pos-above');
  }

  // Horizontal: check if centered tip would clip viewport edges
  const centerX = metricRect.left + metricRect.width / 2;
  if (centerX - tipWidth / 2 < 8) {
    tip.classList.add('align-right');
  } else if (centerX + tipWidth / 2 > window.innerWidth - 8) {
    tip.classList.add('align-left');
  }
}, true);
